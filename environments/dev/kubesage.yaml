# This is the API configuration
api:
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1
  # This is for setting up the metrics for the container more information can be found here: https://prometheus.io/docs/concepts/metric_collection/
  # and here: https://github.com/prometheus-operator/kube-prometheus/blob/main/Documentation/servicemonitor.md
  metrics:
    enabled: true
    additionalLabels:
      release: monitoring
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/fdebar/kubesage
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "v0.7.3"
    digest: sha256:696ab431a21d122ace54b738402e874555345633f2cb0c97b6a42468e6f07b0b
  # This is for setting up the resources for the container more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 8000
# This is the web dashboard configuration
web:
  # This will enable the web dashboard.
  enabled: true
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/fdebar/kubesage-web
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "v0.3.0"
    # This sets the image digest.
    digest: "sha256:4b64bb00991d7588a717fbe2ddd3b66f6b2c9f8c1b645dbb8a3dfc347cb9956c"
  service:
    port: 80
  # This is for setting up the resources for the container more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
# This is the worker configuration
worker:
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1
  # This is for setting up the metrics for the container more information can be found here: https://prometheus.io/docs/concepts/metric_collection/
  # and here: https://github.com/prometheus-operator/kube-prometheus/blob/main/Documentation/servicemonitor.md
  metrics:
    enabled: true
    port: 9090
    additionalLabels:
      release: monitoring
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: ghcr.io/fdebar/kubesage
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "v0.7.3"
    digest: sha256:696ab431a21d122ace54b738402e874555345633f2cb0c97b6a42468e6f07b0b
  # This is for setting up the resources for the container more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
# This is the application configuration
application:
  logLevel: INFO
  environment: development
# This is the AI configuration
ai:
  apiKey: ollama
  existingSecret: ""
  endpoint: http://host.minikube.internal:11434/v1
  provider: ollama
  model: qwen3-coder:30b
# This is the observability configuration
observability:
  # This sets the URL for Prometheus.
  prometheus:
    enabled: true
    url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  # This sets the URL for Grafana.
  grafana:
    enabled: false
    url: http://monitoring-grafana.monitoring.svc.cluster.local:3000
  # This sets the URL for Loki.
  loki:
    enabled: true
    url: http://monitoring-loki.monitoring.svc.cluster.local:3100
  # This sets the URL for Tempo.
  tempo:
    enabled: true
    url: http://monitoring-alloy.monitoring.svc.cluster.local:4318/v1/traces
# This is the database configuration
database:
  host: kubesage-postgresql.kubesage.svc.cluster.local
  port: 5432
  name: kubesage
  username: kubesage
  existingSecret: kubesage-postgresql
  passwordKey: password
# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
