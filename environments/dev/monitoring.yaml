alloy:
  controller:
    type: daemonset
  alloy:
    enableReporting: false
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    configMap:
      content: |
        otelcol.receiver.otlp "kubesage" {
          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            traces = [otelcol.exporter.otlphttp.tempo.input]
          }
        }

        otelcol.exporter.otlphttp "tempo" {
          client {
            endpoint = "http://monitoring-tempo.monitoring.svc.cluster.local:4318"
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "__host__"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pod_logs.receiver]
        }

        loki.process "pod_logs" {
          stage.json {
            expressions = {
              trace_id = "trace_id",
              span_id  = "span_id",
            }
          }

          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "kubesage",
            }
          }
        }

kube-prometheus-stack:
  grafana:
    adminUser: admin
    adminPassword: kubesage-admin
    service:
      type: ClusterIP
      port: 80
    persistence:
      enabled: true
      size: 5Gi
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://monitoring-loki.monitoring.svc.cluster.local:3100
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          derivedFields:
            - name: TraceID
              matcherRegex: "trace_id=(\\w+)"
              datasourceUid: tempo
              url: "${__value.raw}"
        secureJsonData:
          httpHeaderValue1: kubesage

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://monitoring-tempo.monitoring.svc.cluster.local:3200
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: namespace
                value: namespace
              - key: pod
                value: pod
            filterByTraceID: true
            filterBySpanID: false
        secureJsonData:
          httpHeaderValue1: kubesage
    plugins:
      - grafana-piechart-panel
    grafana.ini:
      server:
        domain: localhost
      users:
        allow_sign_up: false
      analytics:
        reporting_enabled: false

kube-prometheus-stack:
  grafana:
    enabled: true
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 15d
  alertmanager:
    enabled: true
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true
# Loki subchart configuration
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  test:
    enabled: false
  # Disable cache in dev and set low values to avoid the pod creation
  chunksCache:
    enabled: false
    resources:
      requests:
        cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  # Inner Loki chart config
  loki:
    commonConfig:
      replication_factor: 1
    # Schema configuration required by Loki v6+
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin

opentelemetry-collector:
  # Deployment mode (daemonset, deployment, or statefulset)
  # Deployment: Applications push OTLP traces, metrics, or logs directly to a central Service endpoint.
  mode: deployment

  # Image configuration
  image:
    repository: otel/opentelemetry-collector-k8s

  # Resource limits & requests
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

tempo:
  reportingEnabled: false
  storage:
    trace:
      backend: local
  receivers:
    otlp:
      protocols:
        grpc:
        http:
persistence:
  enabled: true
  size: 10Gi
