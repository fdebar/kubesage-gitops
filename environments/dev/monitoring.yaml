alloy:
  controller:
    type: daemonset
  alloy:
    enableReporting: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    configMap:
      content: |
        otelcol.receiver.otlp "kubesage" {
          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            traces = [otelcol.exporter.otlphttp.tempo.input]
          }
        }

        otelcol.exporter.otlphttp "tempo" {
          client {
            endpoint = "http://monitoring-tempo.monitoring.svc.cluster.local:4318"
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "__host__"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pod_logs.receiver]
        }

        loki.process "pod_logs" {
          stage.json {
            expressions = {
              trace_id = "trace_id",
              span_id  = "span_id",
            }
          }

          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "kubesage",
            }
          }
        }

kube-prometheus-stack:
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 2d
      retentionSize: 1GB
      enableRemoteWriteReceiver: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  alertmanager:
    enabled: false
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true
  grafana:
    enabled: true
    adminUser: kubesage-admin
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://monitoring-loki.monitoring.svc.cluster.local:3100
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          derivedFields:
            - name: TraceID
              matcherRegex: "trace_id=(\\w+)"
              datasourceUid: tempo
              url: "${__value.raw}"
        secureJsonData:
          httpHeaderValue1: kubesage

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://monitoring-tempo.monitoring.svc.cluster.local:3200
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: namespace
                value: namespace
              - key: pod
                value: pod
            filterByTraceID: true
            filterBySpanID: false
        secureJsonData:
          httpHeaderValue1: kubesage
    plugins:
      - grafana-piechart-panel
    grafana.ini:
      server:
        domain: localhost
      users:
        allow_sign_up: false
      analytics:
        reporting_enabled: false

# Loki subchart configuration
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  test:
    enabled: false
  # Disable cache in dev and set low values to avoid the pod creation
  chunksCache:
    enabled: false
    resources:
      requests:
        cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  # Inner Loki chart config
  loki:
    commonConfig:
      replication_factor: 1
    # Schema configuration required by Loki v6+
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin

tempo: 
  tempo:
    reportingEnabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    storage:
      trace:
        backend: local
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
      processor:
        span_metrics:
          enable_target_info: true
        local_blocks:
          flush_to_storage: true
          filter_server_spans: false
          max_block_duration: 1m
      registry:
        collection_interval: 15s
        external_labels:
          source: tempo
      storage:
        path: "/var/tempo/metrics"
        remote_write: []
      traces_storage:
        path: "/var/tempo/traces"
    overrides:
      defaults:
        metrics_generator:
          processors:
            - span-metrics