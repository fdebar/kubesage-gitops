name: GitOps CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitOps configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Add Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Build monitoring dependencies
        working-directory: charts/monitoring
        run: helm dependency build

      - name: Lint monitoring chart
        run: helm lint charts/monitoring -f environments/dev/monitoring.yaml

      - name: Render monitoring chart
        run: |
          helm template monitoring charts/monitoring \
            -f environments/dev/monitoring.yaml \
            > /tmp/monitoring.yaml

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/monitoring.yaml